id = "m16khb.herdr-agents-graph"
name = "agents-graph"
# The build step downloads the `agents-graph` release tagged `v<version>`, so
# this moves in step with the crate version (the release workflow refuses a tag
# that disagrees with either).
version = "0.2.0"
description = "Watch the focused agent's session (Claude Code, Codex, omp) as a live flow graph."
platforms = ["macos", "linux"]

# 0.9.3 reports `agent_session` as `{kind: "id"}` for Claude Code and Codex and
# `{kind: "path"}` for omp, and hands `focused_pane_id` to every invocation;
# `agents-graph herdr resolve` reads both.
min_herdr_version = "0.9.3"

# `plugin install` runs this after the preview; `plugin link` does not. It
# downloads the release binary into bin/ after checking SHA256SUMS. Herdr runs
# it without any HERDR_PLUGIN_* variable, so the script finds bin/ from its own
# path.
[[build]]
command = ["bash", "herdr/install.sh"]

# Overlay: a temporary zoomed pane that restores the previous focus and zoom when
# it closes. Watching the graph is a peek, not a side-by-side workflow. Users who
# want it persistent can open it as a split or a tab from the actions below.
[[panes]]
id = "graph"
title = "agents-graph"
placement = "overlay"
command = ["bash", "herdr/open.sh"]

# Each action toggles: the first press opens the graph, the next one closes the
# pane it opened (tracked by pane id, so focus can be anywhere).
[[actions]]
id = "open"
title = "agents-graph: session graph (overlay)"
description = "Open the focused agent's session as a flow graph over the focused pane, or close it if it is open. Closing it restores your layout. This is what the default key does."
contexts = ["pane", "workspace"]
command = ["bash", "herdr/pane.sh", "overlay"]

[[actions]]
id = "open-split"
title = "agents-graph: session graph (split)"
description = "Open the focused agent's session as a flow graph split beside the focused pane, or close it if it is open."
contexts = ["pane", "workspace"]
command = ["bash", "herdr/pane.sh", "split"]

[[actions]]
id = "open-tab"
title = "agents-graph: session graph (tab)"
description = "Open the focused agent's session as a flow graph in its own tab, or close it if it is open."
contexts = ["pane", "workspace"]
command = ["bash", "herdr/pane.sh", "tab"]

# Herdr binds keys only from the user's config, so the default key is installed
# by an action: one marker-fenced block, removable by the sibling action.
[[actions]]
id = "setup-keys"
title = "agents-graph: install the default keybinding"
description = "Bind prefix+shift+z to the overlay, and write the split and tab placements beside it as comments. One block in your Herdr config, backed up first."
contexts = ["workspace"]
command = ["bash", "herdr/keys.sh", "setup"]

[[actions]]
id = "remove-keys"
title = "agents-graph: remove the default keybinding"
description = "Delete the block setup-keys wrote."
contexts = ["workspace"]
command = ["bash", "herdr/keys.sh", "remove"]
